# Entorno local de desarrollo y demostración (costo cero).
#
#   dart run tool/up.dart     levanta todo y crea .env si no existe
#   dart run tool/share.dart  además compila la web y abre un link público
#                             (perfil `compartir`, ver docs/exposicion.md)
#   dart run tool/down.dart   lo detiene (agrega --borrar-datos para empezar de cero)
#
# Producción NO usa este archivo: ver deploy/docker-compose.prod.yml.
name: monedero

services:
  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monedero}
      # Dueño del esquema: solo lo usan las migraciones, nunca la API.
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-monedero_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Falta POSTGRES_OWNER_PASSWORD en .env}
    ports:
      # Solo accesible desde la laptop (pruebas de integración y psql).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    # Captura los correos de códigos de verificación; nada sale a Internet.
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de la red de Docker los servicios se llaman por su nombre.
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # La API sirve el build web de Flutter en el mismo origen (ADR 0011).
      # Se monta la carpeta `build` completa porque `flutter build web`
      # vuelve a crear `build/web`.
      WEB_DIR: /app/build/web
    volumes:
      - ./apps/app/build:/app/build:ro
    ports:
      # 0.0.0.0 para que el emulador (10.0.2.2) y los teléfonos de la misma
      # Wi-Fi lleguen a la API.
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  tunnel:
    # Link público temporal y gratuito (https://<algo>.trycloudflare.com)
    # hacia la API, que también sirve la app web. Sin cuenta de Cloudflare;
    # el link cambia cada vez que se crea el contenedor. Solo con:
    #   docker compose --profile compartir up -d   (lo hace tool/share.dart)
    image: cloudflare/cloudflared:2026.9.3
    profiles: [compartir]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:${API_PORT:-8080}
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
