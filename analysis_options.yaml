# Reglas de análisis compartidas por todo el monorepo.
# Cada paquete incluye este archivo y puede agregar reglas propias.
# Objetivo: `dart analyze` / `flutter analyze` sin advertencias ni avisos.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/build/**"
    - "**/.dart_tool/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Documentación obligatoria de la API pública (comentarios ///).
    - public_member_api_docs
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - only_throw_errors
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
