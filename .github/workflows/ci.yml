# Análisis, formato, guardia de dinero y pruebas (unitarias e integración
# contra PostgreSQL real) en cada push a main y en cada pull request.
# Equivale a `dart run tool/check.dart` en local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: postgres:17.11
        env:
          POSTGRES_DB: monedero
          POSTGRES_USER: monedero_owner
          POSTGRES_PASSWORD: ci_owner_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monedero_owner"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_OWNER_USER: monedero_owner
      POSTGRES_OWNER_PASSWORD: ci_owner_password
      POSTGRES_APP_USER: monedero_app
      POSTGRES_APP_PASSWORD: ci_app_password
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Formato, análisis, guardia de dinero y pruebas
        run: dart run tool/check.dart

  api-image:
    name: api-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen de la API
        run: docker build -f api/Dockerfile -t monedero-api:ci .
