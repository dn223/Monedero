name: monedero
description: "Monedero electrónico prepago (prototipo UFG). App Flutter para Android y Web."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Lo exige Flutter al compilar para web aunque la app use Material Icons.
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  http: ^1.6.0
  monedero_core: any

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
