# Reglas de Flutter más las reglas comunes del monorepo.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "build/**"
    - "**/*.g.dart"
    - android/**
    - web/**

linter:
  rules:
    - public_member_api_docs
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - only_throw_errors
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
