openapi: 3.1.0
info:
  title: Monedero API
  version: 0.6.0
  summary: API del monedero electrónico prepago de circuito cerrado (prototipo UFG).
  description: |
    Convenciones (ver docs/api.md):
    - Dinero siempre como entero en centavos (`*Cents`).
    - Recargas, cobros y reposiciones exigen `Idempotency-Key`.
    - Los errores siempre usan el esquema `ApiError`.
    - Límite de solicitudes por cliente y minuto: `429 RATE_LIMITED` con `Retry-After`.
    - Con `DEMO_MODE=true` algunas respuestas incluyen `demoCode` (el código que
      en producción solo llega por correo) y existen las rutas `/v1/demo/...`.
servers:
  - url: /
    description: Mismo origen que la app web (localhost:8080 o el link del túnel)
  - url: http://localhost:8080
    description: Local (Docker Compose)
  - url: http://10.0.2.2:8080
    description: Local desde el emulador Android

tags:
  - name: Sistema
  - name: Autenticación
  - name: Titular
  - name: Caja
  - name: Administración
  - name: Demo
  - name: Módulos

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Sistema]
      operationId: getHealth
      summary: Estado de la API
      security: []
      responses:
        '200':
          description: La API está operativa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
              example: {status: ok, version: 0.1.0, demoMode: true}

  /v1/auth/cardholders/register:
    post:
      tags: [Autenticación]
      operationId: registerCardholder
      summary: Registrar titular (envía código por correo)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, pin]
              properties:
                fullName: {type: string}
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
                pin: {type: string, pattern: '^\d{4}$'}
            example: {fullName: Ana López, email: ana@ejemplo.com, password: ClaveSegura1, pin: '2468'}
      responses:
        '201':
          description: Registrado; código enviado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardholderId: {type: string, format: uuid}
                  email: {type: string}
                  demoCode: {type: string, description: 'Solo con DEMO_MODE=true.'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /v1/auth/cardholders/verify-email:
    post:
      tags: [Autenticación]
      operationId: verifyEmail
      summary: Verificar correo con el código
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: {type: string}
                code: {type: string, example: '604281'}
      responses:
        '200': {description: Verificado.}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /v1/auth/cardholders/login:
    post:
      tags: [Autenticación]
      operationId: loginCardholder
      summary: Inicio de sesión del titular
      security: []
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}

  /v1/auth/terminals/login:
    post:
      tags: [Autenticación, Caja]
      operationId: terminalLogin
      summary: Abrir la caja con su código
      description: El código lo entrega administración al crear la caja (se acepta con o sin guiones). Devuelve la sesión del usuario de esa caja y la credencial para `X-Terminal-Token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, example: K7M4-Q2XP-HT9W}
      responses:
        '200':
          description: Sesión de la caja.
          content:
            application/json:
              example:
                accessToken: eyJ…
                tokenType: Bearer
                expiresInSeconds: 900
                refreshToken: '…'
                role: CASHIER
                fullName: Caja 1
                terminalToken: K7M4Q2XPHT9W
                terminalId: 6f1c…
                name: Caja 1
                payCode: '482913'
        '401': {description: 'Código incorrecto o caja revocada (`INVALID_CREDENTIALS`).', $ref: '#/components/responses/Error'}

  /v1/auth/staff/login:
    post:
      tags: [Autenticación]
      operationId: loginStaff
      summary: Inicio de sesión de cajero o administrador
      security: []
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}

  /v1/me/cards:
    get:
      tags: [Titular]
      operationId: myCards
      summary: Mis tarjetas (con credenciales para el QR)
      responses:
        '200':
          description: Tarjetas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Card'}}

  /v1/me/cards/{id}/transactions:
    get:
      tags: [Titular]
      operationId: myTransactions
      summary: Historial de movimientos
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Transactions'}
        '404': {$ref: '#/components/responses/Error'}

  /v1/me/cards/{id}/loss-reports:
    post:
      tags: [Titular]
      operationId: startLossReport
      summary: Reportar pérdida (envía código)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '202':
          description: Código enviado al correo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  codeSent: {type: boolean}
                  demoCode: {type: string, description: 'Solo con DEMO_MODE=true.'}
        '409': {$ref: '#/components/responses/Error'}

  /v1/me/cards/{id}/loss-reports/confirm:
    post:
      tags: [Titular]
      operationId: confirmLossReport
      summary: Confirmar pérdida con el código → BLOCKED
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code], properties: {code: {type: string}}}
      responses:
        '200':
          description: Tarjeta bloqueada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Card'}
        '422': {$ref: '#/components/responses/Error'}

  /v1/me/pin:
    put:
      tags: [Titular]
      operationId: changePin
      summary: Cambiar PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPin, newPin]
              properties:
                currentPin: {type: string}
                newPin: {type: string, pattern: '^\d{4}$'}
      responses:
        '200': {description: PIN cambiado.}
        '403': {description: 'Módulo `pin_change` apagado (`MODULE_DISABLED`).', $ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}

  /v1/assistant/messages:
    post:
      tags: [Titular, Módulos]
      operationId: askAssistant
      summary: Preguntar al asistente virtual (módulo `assistant`)
      description: Responde por reglas con el saldo y el último movimiento reales del titular. No guarda la conversación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, maxLength: 500}
      responses:
        '200':
          description: Respuesta del asistente.
          content:
            application/json:
              example:
                intent: balance
                reply: Tu saldo es $17.35.
                suggestions: ['¿Cuál fue mi último movimiento?', '¿Cómo recargo?', 'Perdí mi tarjeta']
        '400': {$ref: '#/components/responses/Error'}
        '403': {description: 'Rol distinto de titular o módulo apagado (`MODULE_DISABLED`).', $ref: '#/components/responses/Error'}

  /v1/modules:
    get:
      tags: [Módulos]
      operationId: listModules
      summary: Módulos de la aplicación y si están encendidos
      security: []
      responses:
        '200':
          description: Todos los módulos, en orden fijo.
          content:
            application/json:
              example:
                items:
                  - key: assistant
                    name: Asistente virtual
                    description: 'Chat que responde dudas del titular: saldo, recargas, pagos, PIN y pérdida de la tarjeta.'
                    audience: CARDHOLDER
                    enabled: true
                    updatedAt: '2026-10-27T15:00:00Z'
                    updatedByName: null

  /v1/admin/modules/{key}:
    put:
      tags: [Administración, Módulos]
      operationId: setModule
      summary: Encender o apagar un módulo
      description: Queda registrado en `module_changes` con quién y cuándo.
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, enum: [assistant, self_registration, holder_payments, card_qr, pin_change]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200': {description: El módulo con su estado nuevo.}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /v1/cards/read:
    post:
      tags: [Caja]
      operationId: readCard
      summary: Validar tarjeta leída (QR, lista demo o número)
      security: [{bearerAuth: [], terminalToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card]
              properties:
                card: {$ref: '#/components/schemas/CardCredentials'}
      responses:
        '200':
          description: Tarjeta válida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  numberMasked: {type: string}
                  cardholderName: {type: string}
                  status: {$ref: '#/components/schemas/CardStatus'}
                  balanceCents: {type: integer, format: int64}
                  pinRequiredAboveCents: {type: integer}
        '422': {$ref: '#/components/responses/Error'}

  /v1/cards/top-ups:
    post:
      tags: [Caja]
      operationId: topUp
      summary: Recargar (múltiplos de $5)
      security: [{bearerAuth: [], terminalToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CardOperation'}
      responses:
        '201': {$ref: '#/components/responses/Receipt'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}

  /v1/cards/debits:
    post:
      tags: [Caja]
      operationId: debit
      summary: Cobrar (PIN si supera el límite)
      security: [{bearerAuth: [], terminalToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CardOperation'}
      responses:
        '201': {$ref: '#/components/responses/Receipt'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /v1/admin/cardholders:
    get:
      tags: [Administración]
      operationId: searchCardholders
      summary: Buscar titulares
      parameters: [{$ref: '#/components/parameters/Q'}]
      responses:
        '200': {description: Titulares encontrados.}

  /v1/admin/cards:
    get:
      tags: [Administración]
      operationId: searchCards
      summary: Buscar tarjetas
      parameters: [{$ref: '#/components/parameters/Q'}]
      responses:
        '200': {description: Tarjetas encontradas.}
    post:
      tags: [Administración]
      operationId: issueCard
      summary: Emitir tarjeta virtual (PENDING)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [cardholderId], properties: {cardholderId: {type: string, format: uuid}}}
      responses:
        '201':
          description: Tarjeta emitida.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Card'}
        '409': {$ref: '#/components/responses/Error'}

  /v1/admin/cards/{id}/deliver:
    post:
      tags: [Administración]
      operationId: deliverCard
      summary: Entregar tarjeta (PENDING → ACTIVE)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Tarjeta activa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Card'}
        '409': {$ref: '#/components/responses/Error'}

  /v1/admin/cards/{id}/replace:
    post:
      tags: [Administración]
      operationId: replaceCard
      summary: Reponer tarjeta bloqueada conservando el saldo
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201':
          description: Reposición hecha en una sola transacción.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferredCents: {type: integer, format: int64}
                  oldCard: {$ref: '#/components/schemas/Card'}
                  newCard: {$ref: '#/components/schemas/Card'}
        '409': {$ref: '#/components/responses/Error'}

  /v1/admin/cards/{id}/transactions:
    get:
      tags: [Administración]
      operationId: cardTransactions
      summary: Movimientos de una tarjeta
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Transactions'}

  /v1/admin/reconciliation:
    get:
      tags: [Administración]
      operationId: reconciliation
      summary: Conciliación (saldo vs. suma de movimientos)
      responses:
        '200':
          description: Resumen y detalle por tarjeta.
          content:
            application/json:
              example:
                cards: 4
                cardsWithDifference: 0
                totalBalanceCents: 8265
                totalDifferenceCents: 0
                items: [{cardNumberMasked: '•••• 0967', status: ACTIVE, balanceCents: 1765, ledgerCents: 1765, differenceCents: 0, transactionCount: 1}]

  /v1/admin/terminals:
    get:
      tags: [Administración]
      operationId: listTerminals
      summary: Listar terminales
      responses:
        '200': {description: Terminales.}
    post:
      tags: [Administración]
      operationId: createTerminal
      summary: Registrar terminal (la credencial se muestra una sola vez)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string}}}
      responses:
        '201':
          description: Terminal creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  terminalId: {type: string, format: uuid}
                  name: {type: string}
                  terminalToken: {type: string}

  /v1/admin/terminals/{id}:
    delete:
      tags: [Administración]
      operationId: revokeTerminal
      summary: Revocar terminal
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Revocado.}

  /v1/demo/cards:
    get:
      tags: [Demo]
      operationId: demoCards
      summary: Tarjetas activas para la caja (solo DEMO_MODE=true)
      responses:
        '200': {description: Tarjetas.}
        '403': {$ref: '#/components/responses/Error'}

  /v1/auth/cardholders/resend-code:
    post:
      tags: [Autenticación]
      operationId: resendVerificationCode
      summary: Reenviar el código de verificación (misma respuesta exista o no la cuenta)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [email], properties: {email: {type: string}}}
      responses:
        '202':
          description: Si la cuenta existe y no está verificada, se envió un código nuevo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  codeSent: {type: boolean}
                  demoCode: {type: string, description: 'Solo con DEMO_MODE=true.'}

  /v1/auth/refresh:
    post:
      tags: [Autenticación]
      operationId: refreshSession
      summary: Renovar la sesión (rota el token de renovación; ADR 0010)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [refreshToken], properties: {refreshToken: {type: string}}}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}

  /v1/auth/logout:
    post:
      tags: [Autenticación]
      operationId: logout
      summary: Cerrar sesión (revoca el token de renovación)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [refreshToken], properties: {refreshToken: {type: string}}}
      responses:
        '200': {description: Sesión cerrada.}

  /v1/me/payments:
    post:
      tags: [Titular]
      operationId: payAtTerminal
      summary: El titular paga desde su app en la caja con su código de 6 dígitos
      description: Mismo cobro que `/v1/cards/debits` (FOR UPDATE, idempotencia, PIN sobre el límite) con la tarjeta ACTIVE del titular.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminalCode, amountCents]
              properties:
                terminalCode: {type: string, pattern: '^\d{6}$'}
                amountCents: {type: integer, format: int64, minimum: 1}
                pin: {type: string, pattern: '^\d{4}$'}
      responses:
        '201': {$ref: '#/components/responses/Receipt'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}

  /v1/cards/terminal:
    get:
      tags: [Caja]
      operationId: describeTerminal
      summary: Nombre y código de pago de la caja de la credencial enviada
      security: [{bearerAuth: [], terminalToken: []}]
      responses:
        '200':
          description: Caja.
          content:
            application/json:
              schema:
                type: object
                properties:
                  terminalId: {type: string, format: uuid}
                  name: {type: string}
                  payCode: {type: string, pattern: '^\d{6}$'}
        '403': {$ref: '#/components/responses/Error'}

  /v1/cards/terminal-activity:
    get:
      tags: [Caja]
      operationId: terminalActivity
      summary: Últimos 10 movimientos de la caja (incluye pagos con código)
      security: [{bearerAuth: [], terminalToken: []}]
      responses:
        '200': {$ref: '#/components/responses/Transactions'}

  /v1/admin/stats:
    get:
      tags: [Administración]
      operationId: adminStats
      summary: Indicadores del tablero
      responses:
        '200':
          description: Tarjetas por estado, saldo en circulación y serie diaria de 14 días (zona America/El_Salvador).
          content:
            application/json:
              example:
                cardsByStatus: {PENDING: 0, ACTIVE: 2, BLOCKED: 0, REPLACED: 0}
                totalBalanceCents: 6500
                cardholders: 2
                activeTerminals: 1
                transactions: 2
                timeZone: America/El_Salvador
                daily: [{day: '2026-10-25', topUpCents: 6500, debitCents: 0, operations: 2}]

  /v1/admin/demo/reset:
    post:
      tags: [Administración, Demo]
      operationId: resetDemo
      summary: Reiniciar la demo (borra todo y siembra; solo DEMO_MODE=true; ADR 0012)
      responses:
        '200': {description: Demo reiniciada; las sesiones anteriores dejan de servir.}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /v1/demo/terminals:
    post:
      tags: [Demo]
      operationId: createDemoTerminal
      summary: Crear "Caja demo N" para este dispositivo (cajero, solo DEMO_MODE=true)
      responses:
        '201': {description: 'Caja creada: terminalId, name, payCode y terminalToken (una sola vez).'}
        '403': {$ref: '#/components/responses/Error'}

  /v1/demo/inbox:
    get:
      tags: [Demo]
      operationId: demoInbox
      summary: Correos recibidos por el titular autenticado (en memoria; solo DEMO_MODE=true)
      responses:
        '200':
          description: El más reciente primero.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        subject: {type: string}
                        text: {type: string}
                        sentAt: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Error'}

  /v1/demo/cashier-session:
    post:
      tags: [Demo]
      operationId: demoCashierSession
      summary: Sesión de cajero y credencial de "Caja Demo" sin contraseña (solo DEMO_MODE=true)
      security: []
      responses:
        '200': {description: 'Sesión (ver Session) más terminalId, name, payCode y terminalToken.'}
        '403': {$ref: '#/components/responses/Error'}

  /v1/demo/holder-session:
    post:
      tags: [Demo]
      operationId: demoHolderSession
      summary: Sesión de un titular verificado sin contraseña (solo DEMO_MODE=true)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [email], properties: {email: {type: string}}}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '403': {$ref: '#/components/responses/Error'}

  /v1/demo/terminal-activity/{payCode}:
    get:
      tags: [Demo]
      operationId: demoTerminalActivity
      summary: Movimientos de la caja con ese código (cajero, solo DEMO_MODE=true)
      parameters: [{name: payCode, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {$ref: '#/components/responses/Transactions'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    terminalToken: {type: apiKey, in: header, name: X-Terminal-Token}

  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Q: {name: q, in: query, required: false, schema: {type: string}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID del cliente; se reutiliza en cada reintento de la misma operación.
      schema: {type: string, format: uuid}

  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: {type: string}
              password: {type: string}
          example: {email: cajero@monedero.local, password: Cajero1234}
    CardOperation:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [card, amountCents]
            properties:
              card: {$ref: '#/components/schemas/CardCredentials'}
              amountCents: {type: integer, format: int64, minimum: 1}
              pin: {type: string, pattern: '^\d{4}$'}
          example:
            card: {number: '9990142405712970', uid: 2C0C8C5A3E42A3, signature: B42149E136746651633E81491192A81D}
            amountCents: 735

  responses:
    Error:
      description: Error estándar.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
          example: {error: {code: INSUFFICIENT_FUNDS, message: Saldo insuficiente., details: {balanceCents: 1265, amountCents: 1500}}}
    Session:
      description: Sesión iniciada.
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: {type: string}
              tokenType: {type: string, enum: [Bearer]}
              expiresInSeconds: {type: integer}
              refreshToken: {type: string, description: 'Se envía una vez; la base guarda su SHA-256.'}
              refreshExpiresInSeconds: {type: integer}
              role: {type: string, enum: [CARDHOLDER, CASHIER, ADMIN]}
              userId: {type: string, format: uuid}
              fullName: {type: string}
    Receipt:
      description: Comprobante (idéntico si se repite la Idempotency-Key).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Receipt'}
    Transactions:
      description: Movimientos, el más reciente primero.
      content:
        application/json:
          schema:
            type: object
            properties:
              items: {type: array, items: {$ref: '#/components/schemas/Receipt'}}

  schemas:
    HealthStatus:
      type: object
      required: [status, version, demoMode]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
        demoMode: {type: boolean}
    CardStatus: {type: string, enum: [PENDING, ACTIVE, BLOCKED, REPLACED]}
    CardCredentials:
      type: object
      description: Lo que entrega el lector (QR hoy, NFC mañana).
      required: [number, uid, signature]
      properties:
        number: {type: string, pattern: '^\d{16}$'}
        uid: {type: string, pattern: '^[0-9A-F]{14}$'}
        signature: {type: string, pattern: '^[0-9A-F]{32}$'}
    Card:
      type: object
      properties:
        cardId: {type: string, format: uuid}
        cardholderId: {type: string, format: uuid}
        cardholderName: {type: string}
        number: {type: string}
        numberMasked: {type: string}
        status: {$ref: '#/components/schemas/CardStatus'}
        balanceCents: {type: integer, format: int64}
        credentials: {$ref: '#/components/schemas/CardCredentials'}
    Receipt:
      type: object
      properties:
        transactionId: {type: string, format: uuid}
        type: {type: string, enum: [TOP_UP, DEBIT, REPLACEMENT_OUT, REPLACEMENT_IN]}
        amountCents: {type: integer, format: int64}
        balanceAfterCents: {type: integer, format: int64}
        cardNumberMasked: {type: string}
        createdAt: {type: string, format: date-time}
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, UNAUTHORIZED, INVALID_CREDENTIALS, FORBIDDEN, TERMINAL_NOT_AUTHORIZED, DEMO_MODE_DISABLED, NOT_FOUND, CONFLICT, CARD_NOT_ACTIVE, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, INVALID_AMOUNT, INSUFFICIENT_FUNDS, INVALID_CARD_SIGNATURE, PIN_REQUIRED, INVALID_PIN, INVALID_VERIFICATION_CODE, TOO_MANY_ATTEMPTS, RATE_LIMITED, MODULE_DISABLED, INTERNAL_ERROR]
            message: {type: string}
            details: {type: object, additionalProperties: true}
